name: Validate Hebrew Corpus
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authenticated-encryption test dependency
        run: python -m pip install 'cryptography>=42,<48'
      - name: Validate dataset
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify model-neutral exports
        run: |
          python scripts/export.py --format text --output /tmp/train-text.jsonl
          python scripts/export.py --format chars --output /tmp/train-chars.jsonl
          python scripts/export.py --format bytes --output /tmp/train-bytes.jsonl
          python scripts/export.py --format messages --output /tmp/train-messages.jsonl
      - name: Generate and validate a deterministic synthetic world
        run: |
          python scripts/generate_worlds.py --seed 17 --count-per-split 2 --entities 12 --steps 4 --documents 3 --generalization world --output-dir /tmp/hu-worlds
          python scripts/validate.py --root /tmp/hu-worlds
      - name: Offline staging smoke test
        run: |
          python scripts/ingest_corpus.py --fixture tests/fixtures/wiki-rows.jsonl --limit 10 --output-dir /tmp/hu-stage-smoke
          python scripts/audit_staging.py /tmp/hu-stage-smoke
      - name: Prepare blind review fixture without publishing its text
        run: |
          python scripts/review_calibration.py prepare --stage-dir /tmp/hu-stage-smoke --output-dir /tmp/hu-blind-review --count 5 --seed 17
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/hu-blind-review/blind-review-packet.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines()]
          assert len(rows)==5 and all(set(row)=={'id','text'} for row in rows)
          print('Blind review fixture created; no external text uploaded.')
          PY
