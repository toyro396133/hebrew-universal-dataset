name: Validate Hebrew Corpus
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dataset
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify model-neutral exports
        run: |
          python scripts/export.py --format text --output /tmp/train-text.jsonl
          python scripts/export.py --format chars --output /tmp/train-chars.jsonl
          python scripts/export.py --format bytes --output /tmp/train-bytes.jsonl
          python scripts/export.py --format messages --output /tmp/train-messages.jsonl
      - name: Generate and validate a deterministic synthetic world
        run: |
          python scripts/generate_worlds.py --seed 17 --count-per-split 2 --entities 12 --steps 4 --documents 3 --generalization world --output-dir /tmp/hu-worlds
          python scripts/validate.py --root /tmp/hu-worlds
